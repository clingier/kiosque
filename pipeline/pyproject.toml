[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kiosque-pipeline"
version = "0.1.0"
description = "Kiosque daily processing: normalize, cluster, ownership, metrics, publish"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0.1",
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "jsonschema>=4.21",
    "azure-storage-blob>=12.19.0",
]

[project.scripts]
kiosque-step = "kiosque_pipeline.cli:main"

[project.optional-dependencies]
embed = ["sentence-transformers>=2.7"]
dev = ["pytest>=8", "build>=1.2"]
spark = ["pyspark==4.1.1", "delta-spark==4.3.1", "pandas>=2.2", "pyarrow>=18"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
kiosque_pipeline = ["snapshot.schema.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: downloads the real embedding model (~500 MB, network)",
    "spark: needs a local Spark session (Java 21)",
]
addopts = "-m 'not slow'"
