# =============================================================================
# sources.yaml — Référence des 65 médias français suivis par Kiosque
#
# Chaque entrée contient :
#   slug            : identifiant unique (minuscules, tirets)
#   name            : nom d'affichage
#   owner_group     : bollore | niel | bouygues | arnault | kretinsky | saade | public | independant
#   feeds           : liste ordonnée de flux à essayer [{url, type}]
#   fallback_domain : domaine nu pour Google News RSS (si pas de feed natif)
#   notes           : remarques libres
#   influence       : (optionnel) réseau d'influence non-capitalistique (ex: "sterin-pericles")
#
# Propriété des médias : Acrimed / Le Monde diplomatique (décembre 2025)
# Flux RSS vérifiés : juillet 2026
# =============================================================================

