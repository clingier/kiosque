######################################################################
# tests.yml – Run collector and pipeline unit tests
######################################################################
name: "Tests"

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  functions:
    name: "Collector tests"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r functions/requirements.txt pytest
      - run: pytest functions/tests -q

  pipeline:
    name: "Pipeline tests"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e "pipeline[dev]"
      - run: pytest -q
        working-directory: pipeline
