######################################################################
# terraform-apply.yml – Apply infrastructure changes on merge to main
######################################################################
name: "Terraform Apply"

on:
  push:
    branches: [main]
    paths:
      - "infra/**"

  # Allow manual trigger from the Actions tab
  workflow_dispatch:

permissions:
  contents: read
  id-token: write         # for Azure OIDC federated login

# Prevent concurrent applies
concurrency:
  group: terraform-apply
  cancel-in-progress: false

env:
  TF_DIR: infra
  ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
  ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
  ARM_USE_OIDC: true
  TF_VAR_subscription_id: ${{ secrets.ARM_SUBSCRIPTION_ID }}

jobs:
  apply:
    name: "Apply"
    runs-on: ubuntu-latest
    environment: production   # requires environment approval in repo settings

    steps:
      # ── Checkout ──────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Terraform setup ──────────────────────────────────────────
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~> 1.5"

      # ── Azure OIDC login ─────────────────────────────────────────
      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.ARM_CLIENT_ID }}
          tenant-id: ${{ secrets.ARM_TENANT_ID }}
          subscription-id: ${{ secrets.ARM_SUBSCRIPTION_ID }}

      # ── Init ─────────────────────────────────────────────────────
      - name: Terraform init
        run: terraform init -input=false
        working-directory: ${{ env.TF_DIR }}

      # ── Plan ─────────────────────────────────────────────────────
      - name: Terraform plan
        run: terraform plan -no-color -input=false -out=tfplan
        working-directory: ${{ env.TF_DIR }}

      # ── Apply ────────────────────────────────────────────────────
      - name: Terraform apply
        run: terraform apply -input=false -auto-approve tfplan
        working-directory: ${{ env.TF_DIR }}
