######################################################################
# terraform-plan.yml – Validate & plan on every PR touching infra/
######################################################################
name: "Terraform Plan"

on:
  pull_request:
    branches: [main]
    paths:
      - "infra/**"

permissions:
  contents: read
  pull-requests: write    # to post plan output as PR comment
  id-token: write         # for Azure OIDC federated login

env:
  TF_DIR: infra
  ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
  ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
  ARM_USE_OIDC: true      # federated credentials, no client secret needed
  TF_VAR_subscription_id: ${{ secrets.ARM_SUBSCRIPTION_ID }}

jobs:
  plan:
    name: "Validate & Plan"
    runs-on: ubuntu-latest

    steps:
      # ── Checkout ──────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Terraform setup ──────────────────────────────────────────
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~> 1.5"

      # ── Azure OIDC login ─────────────────────────────────────────
      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.ARM_CLIENT_ID }}
          tenant-id: ${{ secrets.ARM_TENANT_ID }}
          subscription-id: ${{ secrets.ARM_SUBSCRIPTION_ID }}

      # ── Format check ─────────────────────────────────────────────
      - name: Terraform fmt
        id: fmt
        run: terraform fmt -check -recursive
        working-directory: ${{ env.TF_DIR }}
        continue-on-error: true

      # ── Init ─────────────────────────────────────────────────────
      - name: Terraform init
        id: init
        run: terraform init -input=false
        working-directory: ${{ env.TF_DIR }}

      # ── Validate ─────────────────────────────────────────────────
      - name: Terraform validate
        id: validate
        run: terraform validate -no-color
        working-directory: ${{ env.TF_DIR }}

      # ── Plan ─────────────────────────────────────────────────────
      - name: Terraform plan
        id: plan
        run: terraform plan -no-color -input=false -out=tfplan
        working-directory: ${{ env.TF_DIR }}
        continue-on-error: true

      # ── Post plan to PR ──────────────────────────────────────────
      - name: Comment plan on PR
        uses: actions/github-script@v7
        if: github.event_name == 'pull_request'
        env:
          PLAN: ${{ steps.plan.outputs.stdout }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const output = `### Terraform Plan 📋

            | Step | Status |
            |------|--------|
            | 🖌 Format | \`${{ steps.fmt.outcome }}\` |
            | ⚙️ Init | \`${{ steps.init.outcome }}\` |
            | ✅ Validate | \`${{ steps.validate.outcome }}\` |
            | 📖 Plan | \`${{ steps.plan.outcome }}\` |

            <details><summary>Show Plan Output</summary>

            \`\`\`terraform
            ${process.env.PLAN}
            \`\`\`

            </details>

            *Triggered by @${{ github.actor }} · Commit: \`${{ github.event.pull_request.head.sha }}\`*`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            });

      # ── Fail if any step failed ──────────────────────────────────
      - name: Check outcomes
        if: steps.fmt.outcome == 'failure' || steps.plan.outcome == 'failure'
        run: exit 1
